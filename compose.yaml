name: lets-cook

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-letscook}
      POSTGRES_USER: ${POSTGRES_USER:-letscook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letscook_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-letscook} -d ${POSTGRES_DB:-letscook}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-letscook}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-letscook_dev}
      KC_HEALTH_ENABLED: "true"
      # Required so Keycloak reconstructs the public Quick Tunnel HTTPS URL
      # from the forwarding headers sent by the local Nginx gateway.
      KC_PROXY_HEADERS: xforwarded
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-lets-cook-dev-livekit-secret-32-chars}"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

  avatar-storage-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 100:101 /avatars && chmod 700 /avatars"]
    volumes:
      - avatar_uploads:/avatars

  backend:
    build:
      context: ./backend
    env_file:
      - ./infra/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-letscook}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-letscook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-letscook_dev}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/lets-cook/protocol/openid-connect/certs
      APP_SECURITY_ISSUER: http://localhost:8180/realms/lets-cook
      # Keep the local default for LAN development. Set LIVEKIT_PUBLIC_URL to a
      # trusted wss:// endpoint (LiveKit Cloud or a public LiveKit deployment)
      # when Cloudflare UAT users must exchange media across the Internet.
      APP_LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      APP_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      APP_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-lets-cook-dev-livekit-secret-32-chars}
      APP_AVATAR_DIRECTORY: /app/uploads/avatars
    volumes:
      - avatar_uploads:/app/uploads/avatars
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      avatar-storage-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  avatar_uploads:

