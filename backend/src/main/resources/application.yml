server:
  port: 8080
  # Respect the exact public scheme/host supplied by our Nginx reverse proxy.
  # This makes Cloudflare requests same-origin without a broad CORS wildcard.
  forward-headers-strategy: framework
  error:
    include-message: always

spring:
  application:
    name: xynk-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xynk}
    username: ${SPRING_DATASOURCE_USERNAME:xynk}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/xynk/protocol/openid-connect/certs}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    keycloak-url: ${APP_AUTH_KEYCLOAK_URL:https://xynk.in}
    keycloak-client-id: ${KEYCLOAK_NATIVE_AUTH_CLIENT_ID:}
    keycloak-client-secret: ${KEYCLOAK_NATIVE_AUTH_CLIENT_SECRET:}
    google-web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  security:
    issuer: ${APP_SECURITY_ISSUER:http://localhost:8180/realms/xynk}
  livekit:
    mode: ${LIVEKIT_MODE:self-hosted}
    cloud:
      url: ${LIVEKIT_CLOUD_URL:${LIVEKIT_PUBLIC_URL:}}
      api-key: ${LIVEKIT_CLOUD_API_KEY:${LIVEKIT_API_KEY:}}
      api-secret: ${LIVEKIT_CLOUD_API_SECRET:${LIVEKIT_API_SECRET:}}
    self-hosted:
      url: ${LIVEKIT_SELF_HOSTED_URL:ws://localhost:7880}
      api-key: ${LIVEKIT_SELF_HOSTED_API_KEY:${LIVEKIT_API_KEY:}}
      api-secret: ${LIVEKIT_SELF_HOSTED_API_SECRET:${LIVEKIT_API_SECRET:}}
  uploads:
    avatar-directory: ${APP_AVATAR_DIRECTORY:/app/uploads/avatars}
    message-directory: ${APP_MESSAGE_DIRECTORY:/app/uploads/messages}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}

